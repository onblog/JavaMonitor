name = "font-squeeze"
compatibility_date = "2025-01-15"

# 纯静态站点：不占用 Workers 请求的 CPU 配额
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# 域名绑定不在仓库里声明：统一在 Cloudflare Dashboard 的
# Worker → Settings → Domains & Routes 维护，仓库里不出现线上域名。
workers_dev = false

[observability]
enabled = true
