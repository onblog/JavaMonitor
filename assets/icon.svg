<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="字压 FontSqueeze">
  <!-- 满画布圆角方块，背景即主题色 -->
  <rect width="128" height="128" rx="36" fill="#4434d4"/>

  <!-- 圆体「字」：全是圆头笔画，末端带圆角 -->
  <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 宀 的点 -->
    <path d="M64 27 L64 32"/>
    <!-- 宀 的横 -->
    <path d="M22 44 L106 44"/>
    <!-- 宀 两侧垂笔 -->
    <path d="M22 44 L22 62"/>
    <path d="M106 44 L106 62"/>
    <!-- 子 的上横 -->
    <path d="M45 73 L83 73"/>
    <!-- 子 的竖 -->
    <path d="M64 73 L64 96"/>
    <!-- 子 的底横 -->
    <path d="M28 105 L100 105"/>
  </g>
</svg>
